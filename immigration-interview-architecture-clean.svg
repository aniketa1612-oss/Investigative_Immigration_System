<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#243746"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #17365d; }
      .label { font: 700 25px Arial, sans-serif; fill: #1f2933; }
      .small { font: 400 18px Arial, sans-serif; fill: #374957; }
      .white { fill: #ffffff; }
      .line { stroke: #243746; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #243746; stroke-width: 3; fill: none; }
      .box { stroke: #3f6f8f; stroke-width: 2.5; rx: 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="65" text-anchor="middle" class="title">Immigration Interview System Architecture</text>
  <line x1="320" y1="88" x2="1280" y2="88" stroke="#7b9db5" stroke-width="2"/>

  <!-- Applicant -->
  <rect x="525" y="120" width="550" height="68" class="box" fill="#dbeaf4"/>
  <text x="800" y="163" text-anchor="middle" class="label">Applicant or Traveller</text>

  <!-- Setup -->
  <path d="M800 188 L800 225" class="line"/>
  <rect x="525" y="230" width="550" height="68" class="box" fill="#eef5f9"/>
  <text x="800" y="273" text-anchor="middle" class="label">Consent and Interview Setup</text>

  <!-- Input branches -->
  <path d="M800 298 L800 324 L485 324 L485 350" class="line"/>
  <path d="M800 298 L800 324 L1115 324 L1115 350" class="line"/>
  <rect x="275" y="355" width="420" height="68" class="box" fill="#ffffff"/>
  <rect x="905" y="355" width="420" height="68" class="box" fill="#ffffff"/>
  <text x="485" y="398" text-anchor="middle" class="label">Microphone Input</text>
  <text x="1115" y="398" text-anchor="middle" class="label">Webcam Input</text>

  <!-- Local processing -->
  <path d="M485 423 L485 460" class="line"/>
  <path d="M1115 423 L1115 460" class="line"/>
  <rect x="275" y="465" width="420" height="86" class="box" fill="#e3f2ef"/>
  <rect x="905" y="465" width="420" height="86" class="box" fill="#e3f2ef"/>
  <text x="485" y="500" text-anchor="middle" class="label">faster-whisper</text>
  <text x="485" y="529" text-anchor="middle" class="small">Offline multilingual transcription</text>
  <text x="1115" y="500" text-anchor="middle" class="label">MediaPipe</text>
  <text x="1115" y="529" text-anchor="middle" class="small">Facial movement observations</text>

  <!-- Backend -->
  <path d="M485 551 L485 575 L800 575" class="wire"/>
  <path d="M1115 551 L1115 575 L800 575" class="wire"/>
  <path d="M800 575 L800 583" class="line"/>
  <rect x="525" y="590" width="550" height="68" class="box" fill="#dbeaf4"/>
  <text x="800" y="633" text-anchor="middle" class="label">FastAPI Backend</text>

  <!-- Data and LLM -->
  <path d="M800 658 L800 682 L485 682 L485 708" class="line"/>
  <path d="M800 658 L800 682 L1115 682 L1115 708" class="line"/>
  <rect x="275" y="713" width="420" height="82" class="box" fill="#ffffff"/>
  <rect x="905" y="713" width="420" height="82" class="box" fill="#ffffff"/>
  <text x="485" y="762" text-anchor="middle" class="label">SQLite Database</text>
  <text x="1115" y="749" text-anchor="middle" class="label">Ollama qwen3:14b</text>
  <text x="1115" y="777" text-anchor="middle" class="small">Questions and structured report</text>

  <!-- Human decision -->
  <path d="M485 795 L485 812 L800 812" class="wire"/>
  <path d="M1115 795 L1115 812 L800 812" class="wire"/>
  <path d="M800 812 L800 818" class="line"/>
  <rect x="525" y="825" width="550" height="58" class="box" fill="#e7f2e8" stroke="#427a4b"/>
  <text x="800" y="862" text-anchor="middle" class="label">Officer Review and Final Decision</text>
</svg>
