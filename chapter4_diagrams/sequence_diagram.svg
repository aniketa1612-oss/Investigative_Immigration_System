<path d="M695 365H425" class="ret"/><text x="490" y="356" class="m">Session ready</text>
<path d="M155 410H425" class="msg"/><text x="235" y="401" class="m">Start interview and record response</text>
<path d="M425 455H695" class="msg"/><text x="480" y="446" class="m">Upload audio segment</text>
<path d="M695 500H965" class="msg"/><text x="748" y="491" class="m">Transcribe locally</text>
<path d="M965 545H695" class="ret"/><text x="750" y="536" class="m">Transcript text</text>
