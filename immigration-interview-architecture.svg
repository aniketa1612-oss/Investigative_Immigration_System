<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#175a8d"/>
      <stop offset="1" stop-color="#237faa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087f8c"/>
      <stop offset="1" stop-color="#14a3a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#487089"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="145" cy="100" r="100" fill="#d9eef6" opacity="0.65"/>
  <circle cx="1480" cy="790" r="145" fill="#d8edf1" opacity="0.6"/>

  <text x="800" y="72" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#15364c">Immigration Interview System Architecture</text>
  <text x="800" y="108" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="20" fill="#567184">Local multilingual processing with human-controlled decisions</text>

  <!-- Connectors -->
  <g stroke="#487089" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M800 215 L800 248"/>
  </g>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="480" y="135" width="640" height="80" rx="20" fill="url(#primary)"/>
  </g>
  <circle cx="535" cy="175" r="27" fill="#ffffff" opacity="0.2"/>
  <text x="535" y="184" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <text x="800" y="185" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Applicant or Traveller</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="480" y="255" width="640" height="80" rx="20" fill="#ffffff" stroke="#75a9c1" stroke-width="3"/>
  </g>
  <circle cx="535" cy="295" r="27" fill="#dceef6"/>
  <text x="535" y="304" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#175a8d">2</text>
  <text x="800" y="305" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#234a63">Consent and Interview Setup</text>

  <!-- Stage 3 split -->
  <g filter="url(#shadow)">
    <rect x="300" y="375" width="470" height="80" rx="20" fill="#ffffff" stroke="#75a9c1" stroke-width="3"/>
    <rect x="830" y="375" width="470" height="80" rx="20" fill="#ffffff" stroke="#75a9c1" stroke-width="3"/>
  </g>
  <circle cx="355" cy="415" r="27" fill="#dceef6"/>
  <text x="355" y="424" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#175a8d">3A</text>
  <text x="545" y="425" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#234a63">Microphone Input</text>
  <circle cx="885" cy="415" r="27" fill="#dceef6"/>
  <text x="885" y="424" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#175a8d">3B</text>
  <text x="1075" y="425" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#234a63">Webcam Input</text>

  <!-- Stage 4 split -->
  <g filter="url(#shadow)">
    <rect x="300" y="495" width="470" height="80" rx="20" fill="url(#accent)"/>
    <rect x="830" y="495" width="470" height="80" rx="20" fill="url(#accent)"/>
  </g>
  <text x="535" y="529" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">faster-whisper</text>
  <text x="535" y="556" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="19" fill="#e9ffff">Offline multilingual transcription</text>
  <text x="1065" y="529" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">MediaPipe</text>
  <text x="1065" y="556" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="19" fill="#e9ffff">Local facial movement observations</text>

  <!-- branch arrows -->
  <g stroke="#487089" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M800 335 L800 350 Q800 360 780 360 L535 360 Q535 360 535 368"/>
    <path d="M800 335 L800 350 Q800 360 820 360 L1065 360 Q1065 360 1065 368"/>
    <path d="M535 455 L535 488"/>
    <path d="M1065 455 L1065 488"/>
    <path d="M535 575 L535 594 Q535 615 560 615 L760 615"/>
    <path d="M1065 575 L1065 594 Q1065 615 1040 615 L840 615"/>
    <path d="M800 695 L800 714 Q800 724 780 724 L490 724 Q490 724 490 728"/>
    <path d="M800 695 L800 714 Q800 724 820 724 L1110 724 Q1110 724 1110 728"/>
  </g>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="480" y="615" width="640" height="80" rx="20" fill="url(#primary)"/>
  </g>
  <text x="800" y="665" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">FastAPI Backend</text>

  <!-- Stage 6 combined -->
  <g filter="url(#shadow)">
    <rect x="235" y="735" width="510" height="80" rx="20" fill="#ffffff" stroke="#75a9c1" stroke-width="3"/>
    <rect x="855" y="735" width="510" height="80" rx="20" fill="#ffffff" stroke="#75a9c1" stroke-width="3"/>
  </g>
  <text x="490" y="785" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#234a63">SQLite Database</text>
  <text x="1110" y="778" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#234a63">Ollama qwen3:14b</text>
  <text x="1110" y="803" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="17" fill="#587184">Neutral questions and structured report</text>

  <!-- final human review bar -->
  <rect x="500" y="846" width="600" height="40" rx="20" fill="#e2f3eb" stroke="#4d9a77" stroke-width="2"/>
  <text x="800" y="873" text-anchor="middle" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#256544">Officer Review and Final Decision</text>
  <g stroke="#487089" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M490 815 L490 827 Q490 836 520 846"/>
    <path d="M1110 815 L1110 827 Q1110 836 1080 846"/>
  </g>
</svg>
